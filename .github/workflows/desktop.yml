# Builds the Windows installer.
#
# A .exe can only be produced on Windows, and there is no Windows machine here —
# so GitHub's runner is the build box. Push, wait, download the installer from
# the run's Artifacts. Tag a version and it is attached to a Release instead, so
# a restaurant can be sent a permanent link rather than a file over chat.

name: Desktop (Windows)

on:
  workflow_dispatch:      # build on demand, from the Actions tab
    inputs:
      url:
        description: 'Site the app opens (blank = production)'
        required: false
        default: ''
  push:
    tags: ['v*']          # a tagged version also publishes a Release
    # The "Run workflow" button only appears once this file is on the default
    # branch, so the working branch is listed here too — otherwise there is no
    # way to build an installer before merging, which is exactly when it is
    # needed.
    branches: [main, development-printer-cash-drawer]
    # The till now ships *inside* the exe (scripts/build-desktop.mjs), so the
    # installer is stale the moment any of the app's own source changes — not
    # just the Electron shell's. A filter that lists only electron/** would let
    # a tagged release quietly hand a restaurant yesterday's till.
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'types/**'
      - 'scripts/**'
      - 'electron/**'
      - 'next.config.ts'
      - 'package.json'
      - '.github/workflows/desktop.yml'

jobs:
  build:
    runs-on: windows-latest

    # Creating a Release is a write to the repository. Without this the token is
    # read-only by default and the "Attach to release" step below dies on a 403
    # "Resource not accessible by integration" — after a successful two-minute
    # build, which makes it look like a build failure rather than a permission.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Must match the Node that writes package-lock.json locally. npm 10 and
      # npm 11 disagree about whether optional wasm peers belong in the lock, so
      # a lock written by one makes `npm ci` fail under the other with a
      # "Missing: @emnapi/… from lock file" that looks like a corrupt lockfile
      # and is only a version difference.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Not `npm ci`. The lockfile is generated on macOS, and npm records only
      # the optional platform packages that machine needed — on Windows it then
      # wants @emnapi/* for the wasm fallbacks, finds them absent, and refuses
      # the whole install. `npm install` resolves what this platform actually
      # needs. The lock is not committed from here, so nothing drifts.
      - run: npm install --no-audit --no-fund

      # Two different installers, and the difference is deliberate.
      #
      # Blank url (a tag, or the button left empty) → `desktop:dist`, which runs
      # scripts/build-desktop.mjs first: the till is exported to out-desktop/ and
      # shipped inside the exe. That app opens with no internet, which is the
      # whole point of the offline work.
      #
      # A url → the old shell, a window onto a Vercel preview. No out-desktop/ is
      # produced, so electron/main.ts finds no bundle and loads the site. That is
      # how kitchen printing gets tested against a branch without building a till,
      # and it is *not* what a restaurant should ever be given.
      - name: Build installer
        run: |
          if ("${{ inputs.url }}") {
            npm run desktop:compile
            npx electron-builder --win --publish never --config.extraMetadata.posUrl="${{ inputs.url }}"
          } else {
            npm run desktop:dist
          }
        env:
          # electron-builder would otherwise try to publish to GitHub on its own.
          # The release step below does that, and only for tags.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The till is exported with its Supabase project baked in, and there is
          # no .env.local on a runner — without these the export stops with a
          # named error rather than shipping a till that cannot reach anything.
          # Only the two public values: the service-role key must never be near
          # a build that produces a customer's exe.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: PossibllePOS-Setup
          path: release/*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
