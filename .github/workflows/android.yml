# Builds the Android till APK (android/).
#
# The APK carries its own copy of the seller page, like the exe, so it opens and
# sells with the internet down — and every change to the page needs a new APK.
# The url only picks which site it syncs with. Run it from the Actions tab and
# download the APK from the run's Artifacts.
#
# A release tag (desktop.yml) also runs this, after the exe: the APK is built
# for production and attached to the same draft release, where the tills'
# updater (android/…/Updater.java) finds it once the release is published.
#
# Signing: with the four ANDROID_* secrets set, the APK is signed with the
# restaurant key and each build installs over the last. Without them it is
# signed with a throwaway key — fine to try, but the next build must be
# installed after uninstalling the old one.

name: Android (APK)

on:
  workflow_call:
    inputs:
      release:
        description: 'Attach the APK to the release of this tag'
        type: boolean
        default: false
  workflow_dispatch:      # shown on the Actions tab once this file is on main
    inputs:
      url:
        description: 'Site the app opens (blank = production)'
        required: false
        default: ''
  # Until then: a push to the test branch that touches the app builds one that
  # syncs with the branch's preview site. A tag apk-<n> pushed from any branch
  # builds one for production without merging into main (tags skip `paths`).
  push:
    branches: [development-printer-cash-drawer]
    tags: ['apk-*']
    paths: ['android/**', 'lib/android-bridge.ts', 'lib/android-till.ts', 'lib/till-store/**', 'lib/android-browsers.mjs', 'scripts/build-desktop.mjs', '.github/workflows/android.yml']

env:
  PREVIEW_URL: https://restoran-app-git-developmen-f968e3-abdulla-bashiroglus-projects.vercel.app

jobs:
  build:
    # Its image carries the Android SDK (ANDROID_HOME, licences accepted), so
    # Android's setup action is not used: it asks sdkmanager for the old 'tools'
    # package, which no longer exists, and failed every build here.
    runs-on: ubuntu-24.04
    # An apk-* tag pushes a v-tag and drafts a release (below).
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # The page the APK carries: the same static export as the exe's.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install --no-audit --no-fund

      - name: Export the till page
        run: npm run android:till
        env:
          # Only the two public values, as in desktop.yml: the service-role key
          # must never be near a build that goes onto a restaurant's phone.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The Gradle version is the one in android/gradle/wrapper, same as a Mac.
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "${{ inputs.release }}" = "true" ] || [[ "$GITHUB_REF" == refs/tags/apk-* ]]; then
            # Every till would download it and fail to install it.
            echo "::error::No ANDROID_KEYSTORE_BASE64 secret — a release APK must carry the restaurant key."
            exit 1
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — this APK has a throwaway key and the next one will not install over it."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # A release first: called from desktop.yml its event is the tag's push,
        # and it must open production, not the preview.
        run: |
          if [ "${{ inputs.release }}" = "true" ] || [[ "$GITHUB_REF" == refs/tags/apk-* ]]; then
            ./gradlew assembleRelease
          elif [ "${{ github.event_name }}" = "push" ]; then
            ./gradlew assembleRelease -PposUrl="$PREVIEW_URL"
          elif [ -n "${{ inputs.url }}" ]; then
            ./gradlew assembleRelease -PposUrl="${{ inputs.url }}"
          else
            ./gradlew assembleRelease
          fi
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/PossibllePOS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PossibllePOS-apk
          path: android/app/build/outputs/apk/release/PossibllePOS.apk
          if-no-files-found: error

      - name: Attach to release
        if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/PossibllePOS.apk
          # The exe's job made this draft; the APK joins it. Publishing it on
          # GitHub sends both to the restaurants.
          draft: true

      # An apk-* tag also drafts a release with the APK alone, for the phones.
      # The tills read the newest release's tag (v<package.json version>), so
      # the tag is a v-tag; the exe finds no exe in it and stays as it is.
      # The tag is pushed here with this job's token, which starts no other
      # workflow — publishing the draft in GitHub's page would create it as a
      # new tag and run desktop.yml, which builds an exe for it.
      - name: Tag the APK-only release
        if: startsWith(github.ref, 'refs/tags/apk-')
        run: |
          version=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released — raise the version in package.json first."
            exit 1
          fi
          git tag "v$version" "$GITHUB_SHA"
          git push origin "v$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Draft the APK-only release
        if: startsWith(github.ref, 'refs/tags/apk-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Android APK ${{ env.VERSION }}
          body: Only the Android APK. Exe tills skip this release.
          files: android/app/build/outputs/apk/release/PossibllePOS.apk
          draft: true
