# Builds the Android till APK (android/).
#
# The APK loads the seller page from the site, so a push to the site reaches it
# without a new build. Only changes inside android/ need one. Run it from the
# Actions tab and download the APK from the run's Artifacts.
#
# Signing: with the four ANDROID_* secrets set, the APK is signed with the
# restaurant key and each build installs over the last. Without them it is
# signed with a throwaway key — fine to try, but the next build must be
# installed after uninstalling the old one.

name: Android (APK)

on:
  workflow_dispatch:      # shown on the Actions tab once this file is on main
    inputs:
      url:
        description: 'Site the app opens (blank = production)'
        required: false
        default: ''
  # Until then: a push to the test branch that touches the app builds one that
  # opens the branch's preview site, where the page's Android code already is.
  push:
    branches: [development-printer-cash-drawer]
    paths: ['android/**', 'lib/android-bridge.ts', '.github/workflows/android.yml']

env:
  PREVIEW_URL: https://restoran-app-git-development-p-f968e3-kamrans-projects-11d6b816.vercel.app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # The Gradle version is the one in android/gradle/wrapper, same as a Mac.
      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — this APK has a throwaway key and the next one will not install over it."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ./gradlew assembleRelease -PposUrl="$PREVIEW_URL"
          elif [ -n "${{ inputs.url }}" ]; then
            ./gradlew assembleRelease -PposUrl="${{ inputs.url }}"
          else
            ./gradlew assembleRelease
          fi
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/PossibllePOS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PossibllePOS-apk
          path: android/app/build/outputs/apk/release/PossibllePOS.apk
          if-no-files-found: error
