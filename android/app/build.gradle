plugins {
    id 'com.android.application'
}

// Which site the app opens. Same rule as posUrl in package.json: a build for a
// restaurant opens production; a preview url is for testing only.
def posUrl = project.findProperty('posUrl') ?: 'https://www.possiblle.com'
def appVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version

// The signing key comes from the build's secrets (see .github/workflows/android.yml).
// Without it the APK is signed with a throwaway debug key: fine to try, but the
// next build cannot be installed over it.
def keystore = System.getenv('ANDROID_KEYSTORE_FILE')

// The till's page, as the exe carries it: `npm run android:till` exports it to
// out-android/ (built for older phone browsers), and it goes into the APK as assets/till/ (TillFiles.java).
def tillExport = file('../../out-android')
def tillAssets = layout.buildDirectory.dir('generated/till-assets').get().asFile

def copyTill = tasks.register('copyTill', Sync) {
    from(tillExport)
    into(new File(tillAssets, 'till'))
}

// A release without the page would open nothing with the internet down — the
// one thing it is for. Stop the build rather than ship that.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name ==~ /(assemble|bundle)\w*Release/ } && !new File(tillExport, 'seller/index.html').exists()) {
        throw new GradleException('out-android/ has no till: run `npm run android:till` first')
    }
}

android {
    namespace 'com.possiblle.pos'
    compileSdk 36

    defaultConfig {
        applicationId 'com.possiblle.pos'
        minSdk 26
        // Google Play takes no new app or update below 36 since 2026-08-31.
        // From 35 on, Android draws the app under the status bar (MainActivity
        // makes room for it).
        targetSdk 36
        // 0.4.4 → 404, so every release is a higher number than the one before.
        versionCode appVersion.tokenize('.').collect { it as int }.inject(0) { n, p -> n * 100 + p }
        versionName appVersion
        buildConfigField 'String', 'POS_URL', "\"${posUrl}\""
        buildConfigField 'boolean', 'BUNDLED', 'true'
    }

    // Two apps from one code. "direct" is the APK we hand out and attach to
    // GitHub releases; it updates itself (Updater.java). "play" goes to Google
    // Play as an .aab: Play bans an app that installs its own new version, so
    // it has no updater and no install permission, and Play updates it.
    flavorDimensions = ['store']
    productFlavors {
        direct {
            dimension 'store'
        }
        play {
            dimension 'store'
        }
    }

    sourceSets {
        main.assets.srcDirs += tillAssets
    }

    androidResources {
        // The default leaves out every folder starting with "_", and Next keeps
        // all of the page's code in _next/.
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    buildFeatures {
        buildConfig true
    }

    // SQLite's .so files packed and unpacked on install, the classic way.
    // Stored uncompressed (the newer default) installs on stock Android but
    // gave "parse error" on a Huawei MatePad SE 11 (HarmonyOS 2), 2026-10-23.
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    signingConfigs {
        if (keystore) {
            release {
                storeFile file(keystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                // Both signatures, not v2 alone: a Huawei MatePad SE 11
                // (HarmonyOS 2) refused the v2-only APK with "parse error".
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        // What Android Studio's Run builds: the emulator opens `npm run dev` on
        // this Mac (10.0.2.2 is the Mac, seen from the emulator), so a change
        // can be tried without a push.
        debug {
            buildConfigField 'String', 'POS_URL', '"http://10.0.2.2:3000"'
            buildConfigField 'boolean', 'BUNDLED', 'false'
        }
        release {
            minifyEnabled false
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    // The release lint check crashes under the Java 25 that Android Studio
    // ships ("25.0.3"), and two Java files are not worth a lint run per build.
    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // The till's database brings its own SQLite (TillDb.java). Android 9 ships
    // 3.22, which has no upsert, and the till code (lib/till-store/) uses it.
    implementation 'com.github.requery:sqlite-android:3.49.0'
}

preBuild.dependsOn copyTill
